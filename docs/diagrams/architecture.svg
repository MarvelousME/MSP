<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc" rx="10" />

  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">MSP System Architecture</text>

  <!-- Layers -->
  
  <!-- Presentation Layer -->
  <rect x="50" y="80" width="700" height="100" fill="#e2e8f0" rx="5" filter="url(#shadow)" />
  <text x="60" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#475569">Presentation Layer (Next.js 15)</text>
  <rect x="100" y="120" width="180" height="40" fill="#3b82f6" rx="5" />
  <text x="190" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Admin Dashboard</text>
  <rect x="310" y="120" width="180" height="40" fill="#10b981" rx="5" />
  <text x="400" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Affiliate Portal</text>
  <rect x="520" y="120" width="180" height="40" fill="#f59e0b" rx="5" />
  <text x="610" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Referral Tracking</text>

  <!-- Logic Layer -->
  <rect x="50" y="210" width="700" height="150" fill="#cbd5e1" rx="5" filter="url(#shadow)" />
  <text x="60" y="235" font-family="Arial" font-size="14" font-weight="bold" fill="#475569">Business Logic & API Layer</text>
  
  <rect x="100" y="260" width="120" height="60" fill="#0f172a" rx="5" />
  <text x="160" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">API Routes</text>
  <text x="160" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#94a3b8">(App Router)</text>

  <rect x="250" y="260" width="120" height="60" fill="#0f172a" rx="5" />
  <text x="310" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Commission</text>
  <text x="310" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#94a3b8">Engine</text>

  <rect x="400" y="260" width="120" height="60" fill="#0f172a" rx="5" />
  <text x="460" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">WebSocket</text>
  <text x="460" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#94a3b8">(Socket.io)</text>

  <rect x="550" y="260" width="120" height="60" fill="#0f172a" rx="5" />
  <text x="610" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Background</text>
  <text x="610" y="305" font-family="Arial" font-size="10" text-anchor="middle" fill="#94a3b8">Jobs (BullMQ)</text>

  <!-- Data Layer -->
  <rect x="50" y="390" width="700" height="120" fill="#94a3b8" rx="5" filter="url(#shadow)" />
  <text x="60" y="415" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Data Layer</text>

  <rect x="150" y="440" width="150" height="50" fill="#6366f1" rx="5" />
  <text x="225" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="white">PostgreSQL</text>
  <text x="225" y="480" font-family="Arial" font-size="10" text-anchor="middle" fill="#e0e7ff">(via Prisma)</text>

  <rect x="350" y="440" width="150" height="50" fill="#dc2626" rx="5" />
  <text x="425" y="470" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Redis</text>

  <rect x="550" y="440" width="150" height="50" fill="#ec4899" rx="5" />
  <text x="625" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="white">External</text>
  <text x="625" y="480" font-family="Arial" font-size="10" text-anchor="middle" fill="#fce7f3">(Resend API)</text>

  <!-- Connectors -->
  <line x1="400" y1="180" x2="400" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="360" x2="400" y2="390" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
</svg>
