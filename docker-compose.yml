services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystableprime-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://mystableprime:mystableprime@db:5432/mystableprime
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-string-min-32-chars}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-My Stable Prime <onboarding@resend.dev>}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mystableprime-network

  db:
    image: postgres:16-alpine
    container_name: mystableprime-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mystableprime
      - POSTGRES_PASSWORD=mystableprime
      - POSTGRES_DB=mystableprime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystableprime"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mystableprime-network

volumes:
  postgres_data:

networks:
  mystableprime-network:
    driver: bridge
